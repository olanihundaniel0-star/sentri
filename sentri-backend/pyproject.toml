[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sentri"
version = "0.1.0"
description = "AI security coprocessor backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.12",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.11.3",
    "anthropic==0.49.0",
    "numpy==2.2.4",
    "python-dotenv==1.1.0",
    "httpx==0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.5",
    "pytest-asyncio==0.25.3",
    "ruff==0.11.2",
    "mypy==1.15.0",
]
scripts = [
    "eth-account>=0.13.7",
]

[tool.hatch.build.targets.wheel]
packages = ["sentri"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["sentri"]

[[tool.mypy.overrides]]
# eth-account only ships under the optional `scripts` extra (see
# scripts/bmoni_onboard.py), so it isn't installed in the default dev env.
module = "eth_account.*"
ignore_missing_imports = true

[dependency-groups]
dev = [
    "iniconfig>=2.3.0",
    "mypy>=1.15.0",
    "packaging>=26.2",
    "pluggy>=1.6.0",
    "pytest>=8.3.5",
    "pytest-asyncio>=0.25.3",
    "respx>=0.23.1",
    "ruff>=0.11.2",
]
